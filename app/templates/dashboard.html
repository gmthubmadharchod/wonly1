<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SST Cloud</title><link rel="stylesheet" href="/static/app.css"></head><body><header><div class="brand">SST <span>Cloud</span></div><nav><a href="#files">Files</a><a href="#folders">Folders</a><a id="supportLink">Premium / Support</a><a href="/admin.html" id="adminLink" style="display:none">Admin</a><button id="logout" class="ghost">Logout</button></nav></header><main class="wrap"><section class="hero"><div><p class="eyebrow">PRIVATE TELEGRAM-BACKED CLOUD</p><h1>Simple storage.<br>Serious control.</h1><p class="muted">Your files live in a private Telegram storage vault while SST Cloud keeps the metadata, folders and permissions organized.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><label class="upload"><input id="upload" type="file"><span>＋ Upload file</span></label><select id="uploadFolder" class="small"><option value="">Root folder</option></select><button id="urlImport" class="small" type="button">↗ Import URL</button></div></section><section class="cards"><div class="card"><small>STORAGE</small><strong id="usage">Loading…</strong><div class="bar"><i id="bar"></i></div></div><div class="card"><small>PLAN</small><strong id="plan">Loading…</strong><span id="expiryNote" class="muted"></span></div><div class="card"><small>SUPPORT</small><strong>SST Cloud</strong><span id="supportEmail" class="muted"></span></div></section><section class="panel" id="folders"><div class="panel-head"><h2>Folders</h2><button id="newfolder" class="small">＋ New folder</button></div><div id="folderList" class="folders"></div></section><section class="panel" id="files"><div class="panel-head"><h2>My Files</h2><input id="search" placeholder="Search files…"></div><div id="fileList" class="file-list"></div></section></main><div id="sst-video-overlay" class="video-overlay" hidden><div class="video-box"><button class="video-close" onclick="closeVideo()">✕</button><video id="sst-video" controls playsinline preload="metadata"></video><div id="tap-hint" class="tap-hint"></div></div></div>
<script>
function openVideo(url){const o=document.getElementById("sst-video-overlay"),v=document.getElementById("sst-video");v.src=url;o.hidden=false;v.play().catch(()=>{});}
function closeVideo(){const o=document.getElementById("sst-video-overlay"),v=document.getElementById("sst-video");v.pause();v.removeAttribute("src");v.load();o.hidden=true;}
(function(){let t;document.addEventListener("dblclick",e=>{const o=document.getElementById("sst-video-overlay"),v=document.getElementById("sst-video");if(o.hidden)return;const r=v.getBoundingClientRect();if(e.clientY<r.top||e.clientY>r.bottom)return;const d=e.clientX<r.left+r.width/2?-10:10;v.currentTime=Math.max(0,Math.min(v.duration||0,v.currentTime+d));const h=document.getElementById("tap-hint");h.textContent=d>0?"⏩ +10s":"⏪ -10s";h.classList.add("show");clearTimeout(t);t=setTimeout(()=>h.classList.remove("show"),550);});})();
</script><script src="/static/app.js"></script></body></html>
