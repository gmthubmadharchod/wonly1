<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SST Cloud — Login</title><link rel="stylesheet" href="/static/app.css"></head>
<body class="auth"><main class="auth-card"><div class="brand">SST <span>Cloud</span></div>
<p class="muted">Your private cloud, powered by Telegram storage.</p>
<form id="login"><label>Email</label><input name="email" type="email" required autocomplete="email">
<label>Password</label><input name="password" type="password" required autocomplete="current-password">
<button>Sign in</button><p id="msg" class="msg"></p></form>
<div class="auth-foot">New here? <a href="/register.html">Create account</a></div>
</main><script src="/static/app.js"></script></body></html>
