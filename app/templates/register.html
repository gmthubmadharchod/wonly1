<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SST Cloud — Register</title><link rel="stylesheet" href="/static/app.css"></head>
<body class="auth"><main class="auth-card"><div class="brand">SST <span>Cloud</span></div>
<p class="muted">Create your cloud account.</p>
<form id="register"><label>Name</label><input name="name" required>
<label>Email</label><input name="email" type="email" required>
<label>Password</label><input name="password" type="password" minlength="8" required>
<button>Create account</button><p id="msg" class="msg"></p></form>
<div class="auth-foot">Already have an account? <a href="/login.html">Sign in</a></div>
</main><script src="/static/app.js"></script></body></html>
